name: Build Nova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace

      - name: Nombre corto para el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nova.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nova-launcher-apk
          path: nova.apk
          if-no-files-found: error

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: nova.apk
          make_latest: true
